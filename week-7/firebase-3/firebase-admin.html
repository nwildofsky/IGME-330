<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Firebase Admin</title>
</head>

<body>
    <h1>High Scores</h1>
    <ul id="scores-list">
        <li>No data yet!</li>
    </ul>

    <script type="module">
        /* #1 - The Firebase setup code goes here  - both imports, `firebaseConfig` and `app` */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.7/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.7/firebase-database.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAzcjiqkvrKthoEz6j2cPICLVPYo89mqW4",
            authDomain: "high-scores-c2b59.firebaseapp.com",
            projectId: "high-scores-c2b59",
            storageBucket: "high-scores-c2b59.appspot.com",
            messagingSenderId: "488752191504",
            appId: "1:488752191504:web:02090328a8d783a267d295"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        console.log(app); // make sure firebase is loaded



        // #2 NEW STUFF
        const db = getDatabase();
        const scoresRef = ref(db, 'scores');
        const scoresList = document.querySelector("#scores-list");

        const scoresChanged = (snapshot) => {
            scoresList.innerHTML = "";
            snapshot.forEach(score => {
                const childKey = score.key;
                const childData = score.val();
                console.log(childKey, childData);
                const highScore = document.createElement("li");
                highScore.textContent = `${childData.userId} - ${childData.game} - ${childData.score}`;
                scoresList.appendChild(highScore);
            });
        }

        onValue(scoresRef, scoresChanged);

    </script>
</body>

</html>
