<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>First Canvas</title>
	<style type="text/css">
		canvas {
			border: 1px solid gray;
		}

		body {
			font-family: sans-serif;
		}

		button {
			font-size: 1.2em;
		}

		section {
			margin: .5em 0 .5em 0;
		}
	</style>
	<script>
		// #0 - in this class we will always use ECMAScript 5's "strict" mode
		// See what 'use strict' does here:
		// https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode
		'use strict';

		// #1 call the `init` function after the pages loads
		window.onload = init;

		let ctx;
		let canvas;
		let paused = false;
		let createRectangles = true;
		let createArcs = true;
		let createLines = true;

		function init() {
			console.log("page loaded!");
			// #2 Now that the page has loaded, start drawing!

			// A - `canvas` variable points at <canvas> tag
			canvas = document.querySelector('canvas');

			// B - the `ctx` variable points at a "2D drawing context"
			ctx = canvas.getContext('2d');

			// C - all fill operations are now in red
			ctx.fillStyle = 'red';
			//ctx.fillStyle = '#FF0000';
			//ctx.fillStyle = '#F00';
			//ctx.fillStyle = 'rgba(255, 0, 0, 1)';

			// D - fill a rectangle with the current fill color
			drawRectangle(ctx,20,20,600,440,'red');

			// Draw with rect()
			drawRectangle(ctx,120,120,400,300,'yellow',10,'magenta');

			// Lines
			drawLine(ctx,20,20,620,460,5,'magenta');
			drawLine(ctx,620,20,20,460,5,'magenta');
			// Checkoff
			drawLine(ctx,20,240,620,240,20,'teal');

			// Circles
			drawArc(ctx,320,240,50,0,Math.PI*2,'green',5,'purple');
			// Checkoff
			drawArc(ctx,305,220,5,0,Math.PI*2,'blue',3,'black');
			drawArc(ctx,335,220,5,0,Math.PI*2,'blue',3,'black');

			// Semi-circle
			drawArc(ctx,320,240,20,0,Math.PI,'grey',5,'yellow');

			setupUI()
			update();
		}

		function update() {
			if (paused) return;
			requestAnimationFrame(update);

			const shapesToDraw = [];
			if (createRectangles) shapesToDraw.push(1);
			if (createArcs) shapesToDraw.push(2);
			if (createLines) shapesToDraw.push(3);

			const randomShape = Math.round(Math.random() * (shapesToDraw.length - 1));
			switch (shapesToDraw[randomShape]) {
				case 0:
					break;
				case 1:
					drawRandomRect(ctx);
					break;
				case 2:
					drawRandomArc(ctx);
					break;
				case 3:
					drawRandomLine(ctx);
					break;
			}
		}

		function drawRandomRect(ctx) {
			drawRectangle(ctx, getRandomInt(0, 640), getRandomInt(0, 480), getRandomInt(10, 90),
							getRandomInt(10, 90), getRandomColor(), getRandomInt(2, 12), getRandomColor());
		}

		function drawRandomArc(ctx) {
			drawArc(ctx, getRandomInt(0, 640), getRandomInt(0,480), getRandomInt(10,90),getRandomInt(0,Math.PI*2),
						getRandomInt(0,Math.PI*2),getRandomColor(),getRandomInt(2,12),getRandomColor());
		}

		function drawRandomLine(ctx) {
			drawLine(ctx,getRandomInt(0,640),getRandomInt(0,480),getRandomInt(0,640),getRandomInt(0,480),
						getRandomInt(2,15),getRandomColor());
		}

		// event handlers
		function canvasClicked(e) {
			let rect = e.target.getBoundingClientRect();
			let mouseX = e.clientX - rect.x;
			let mouseY = e.clientY - rect.y;
			console.log(mouseX, mouseY);

			for (let i = 0; i < 10; i++) {
				let x = getRandomInt(-100, 100) + mouseX;
				let y = getRandomInt(-100, 100) + mouseY;
				let radius = getRandomInt(10, 35);
				let color = getRandomColor();
				drawArc(ctx,x,y,radius,0,Math.PI*2,color);
			}
		}

		// canvas helpers
		function drawRectangle(ctx, x, y, width, height, fillStyle = "black", lineWidth = 0, strokeStyle = "black") {
			ctx.save();
			ctx.fillStyle = fillStyle;
			ctx.beginPath();
			ctx.rect(x, y, width, height);
			ctx.fill();
			if (lineWidth > 0) {
				ctx.lineWidth = lineWidth;
				ctx.strokeStyle = strokeStyle;
				ctx.stroke();
			}
			ctx.closePath();
			ctx.restore();
		}

		function drawArc(ctx, x, y, radius, startAngle = 0, endAngle = Math.PI * 2, fillStyle = "black",
							lineWidth = 0, strokeStyle = "black") {
			ctx.save();
			ctx.fillStyle = fillStyle;
			ctx.beginPath();
			ctx.arc(x, y, radius, startAngle, endAngle);
			ctx.fill();
			ctx.closePath();
			if (lineWidth > 0) {
				ctx.lineWidth = lineWidth;
				ctx.strokeStyle = strokeStyle;
				ctx.stroke();
			}
			ctx.restore();
		}

		function drawLine(ctx, x1, y1, x2, y2, lineWidth = 1, strokeStyle = "black") {
			ctx.save();
			ctx.beginPath();
			ctx.moveTo(x1, y1);
			ctx.lineTo(x2, y2);
			ctx.lineWidth = lineWidth;
			ctx.strokeStyle = strokeStyle;
			ctx.stroke();
			ctx.closePath();
			ctx.restore();
		}

		function clearScreen(ctx, clearColor="white") {
			drawRectangle(ctx,0,0,640,480,clearColor);
		}

		// handy utility functions!
		function getRandomColor() {
			function getByte() {
				return 55 + Math.round(Math.random() * 200);
			}
			return "rgba(" + getByte() + "," + getByte() + "," + getByte() + ",.8)";
		}

		function getRandomInt(min, max) {
			return Math.floor(Math.random() * (max - min + 1)) + min;
		}

		// helpers
		function setupUI() {
			document.querySelector('#btnPause').onclick = function () {
				paused = true;
			};
			document.querySelector('#btnPlay').onclick = function () {
				if (paused) {
					paused = false;
					update();
				}
			};
			document.querySelector('#btnClear').onclick = () => clearScreen(ctx);

			canvas.onclick = canvasClicked;

			document.querySelector('#cbRectangles').onclick = function (e) {
				createRectangles = e.target.checked;
			};
			document.querySelector('#cbArcs').onclick = function (e) {
				createArcs = e.target.checked;
			};
			document.querySelector('#cbLines').onclick = function (e) {
				createLines = e.target.checked;
			};
		}
	</script>
</head>

<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>

	<section>
		<button id="btnPlay">Play</button>
		<button id="btnPause">Pause</button>
		<button id="btnClear">Clear</button>
	</section>
	<section>
		<span>
			<input type="checkbox" id="cbRectangles" checked>
			<label for="cbRectangles">Rectangles</label>
		</span>
		<span>
			<input type="checkbox" id="cbArcs" checked>
			<label for="cbArcs">Arcs</label>
		</span>
		<span>
			<input type="checkbox" id="cbLines" checked>
			<label for="cbLines">Lines</label>
		</span>
	</section>
	<section>
		<p>Click on the screen to "spraypaint" rectangles (you probably want the screensaver to be paused)</p>
	</section>
</body>

</html>
