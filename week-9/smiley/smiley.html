<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Canvas 1</title>
	<style type="text/css">
	body{
		background: #dddddd;
 	}

	canvas{
		background: #ffffff;
		cursor: pointer;
		margin-left: 10px;
		margin-top: 10px;
		box-shadow: 3px 3px 6px rgba(0,0,0,0.5);
 	}
	
	</style>
	
	<script>
		"use strict";
		window.onload = init; 
		
		function init(){
			console.log("init() called");

			let canvas = document.querySelector('canvas');
			let ctx = canvas.getContext('2d');

            ctx.fillStyle = 'green';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(375, 250, 170, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(230, 170);
            ctx.lineTo(150, 100);
            ctx.lineTo(50, 70);
            ctx.lineTo(70, 170);
            ctx.lineTo(170, 200);
            ctx.lineTo(230, 220);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(530, 170);
            ctx.lineTo(610, 100);
            ctx.lineTo(710, 70);
            ctx.lineTo(690, 170);
            ctx.lineTo(630, 200);
            ctx.lineTo(530, 220);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
			
		}
		
	</script>
	
</head>
<body>
	<canvas width="750" height="500">
         Get a browser that supports Canvas!
         <!-- The user will only see the above text if their browser is older and doesn't support <canvas> -->
	
      </canvas>
</body>
</html>
