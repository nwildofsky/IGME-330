<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lo-fi Audio Visualizer</title>
	<link href="styles/default-styles.css" type="text/css" rel="stylesheet" />
	<script src="./src/loader.js" type="module"></script>
</head>
<body>
<main>
	<canvas id="bg" width="960" height="540"></canvas>
	<canvas id="left-led" width="93" height="40"></canvas>
	<canvas id="mid-led" width="210" height="40"></canvas>
	<canvas id="right-led" width="85" height="40"></canvas>
	<canvas id="rain" width="960" height="540"></canvas>
	<div id="controls">
		<section>
			<button id="play-btn" data-playing="no"></button>
			<button id="fs-btn">Full Screen</button>
		
			<label>Track: 
				<select id="sl-track">
					<option value="media/Morning-Routine-Lofi-Study-Music.mp3" selected>Lofi Morning Routine</option>
					<option value="media/Missing-You.mp3">Missing You Lofi</option>
					<option value="media/Lo-Fi-Lounge-Chill-Hip-Hop-CITY.mp3">Lofi Lounge Hip Hop</option>
				</select>
			</label>
		</section>
		
		<section>
			Volume: <input type="range" id="volume" min="0" max="2" value="1" step="0.01">
			<span id="volume-label">???</span>
		</section>

		<section>
			<span><input type="checkbox" id="cb-gradient" checked><label for="cb-gradient">Show Gradient</label></span>
			<span><input type="checkbox" id="cb-bars" checked><label for="cb-bars">Show Bars</label></span>
			<span><input type="checkbox" id="cb-circles" checked><label for="cb-circles">Show Circles</label></span>
			<span><input type="checkbox" id="cb-noise"><label for="cb-noise">Show Noise</label></span>
			<span><input type="checkbox" id="cb-invert"><label for="cb-invert">Invert Colors</label></span>
			<span><input type="checkbox" id="cb-emboss"><label for="cb-emboss">Show Emboss</label></span>
		  </section>
	</div>
</main>
</body>
</html>
