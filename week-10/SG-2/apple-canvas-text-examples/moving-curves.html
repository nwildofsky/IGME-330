<html>

<head>
    <!--
		A canvas example from:
		https://developer.apple.com/library/safari/documentation/AudioVideo/Conceptual/HTML-canvas-guide/DrawingLinesandShapes/DrawingLinesandShapes.html
		Their coding style is different from what we'll be using in class - use our style, not theirs.
	-->
    <title>Animated curve example</title>
    <style>
        canvas {
            background: #ffffff;
            cursor: pointer;
            margin-left: 10px;
            margin-top: 10px;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
    </style>
    <script type="text/javascript">
        var canvas, ctx;
        let ctrlX = 5, ctrlY = 150;
        let speed = {x: 3, y: 3};
        let vector = {x: 1, y: -1};

        function init() {
            canvas = document.querySelector("canvas");
            ctx = canvas.getContext("2d");
            animateCurves();
        }

        function animateCurves() {
            requestAnimationFrame(animateCurves);

            // draw curves and control point
            clearScreen();
            drawCurves();
            drawControl();

            // bounce control point on edges and randmize speed
            if (ctrlX >= canvas.width) {
                vector.x = -1;
                speed.x = getRandomInt(1,5);
            }
            else if (ctrlX <= 0) {
                vector.x = 1;
                speed.x = getRandomInt(1,5);
            }
            if (ctrlY >= canvas.height) {
                vector.y = -1;
                speed.y = getRandomInt(1,5);
            }
            else if (ctrlY <= 0) {
                vector.y = 1;
                speed.y = getRandomInt(1,5);
            }

            // update control point position
            ctrlX += vector.x * speed.x;
            ctrlY += vector.y * speed.y;
        }

        function drawCurves() {
            ctx.lineWidth = "3";
            ctx.strokeStyle = "black";
            var ctrlXa = 50;
            var ctrlYa = 300;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(ctrlX, ctrlY, canvas.width, canvas.height);
            ctx.stroke();

            ctx.strokeStyle = "red";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(ctrlX, ctrlY, ctrlXa, ctrlYa, canvas.width, canvas.height);
            ctx.stroke();
        }

        function drawControl() {
            ctx.save();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(ctrlX,ctrlY,5,0,Math.PI*2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function clearScreen() {
            ctx.save();
            ctx.fillStyle = 'white';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.restore();
        }

        function getRandomInt(min, max) {
            return Math.random() * (max - min) + min;
        }

    </script>
</head>

<body onload="init()" style="background-color:#e0e0e0">
    <canvas height="400" width="600">
    </canvas>
</body>

</html>
