<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>XHR - Load JSON</title>
	<style>
		body{
			font-family: sans-serif;
		}
	</style>

</head>
<body>
	<h2>XHR - Load JSON</h2>
	
	<hr>
	<button id="my-button">Load Data</button>
	<div id="output">Click button to load</div>
	

<script>
	document.querySelector("#my-button").onclick = loadJsonXHR;
	function loadJsonXHR(){
		const url = "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2022-01-01";
		// https://earthquake.usgs.gov/fdsnws/event/1/[METHOD[?PARAMETERS]]
		const xhr = new XMLHttpRequest();
		xhr.onload = (e) => {
			console.log(`In onload - HTTP Status Code = ${e.target.status}`);
			let json;
			try{
				json = JSON.parse(e.target.responseText);
			}catch{
				document.querySelector("#output").innerHTML = "<p>BAD JSON!</p>";
				return;
			}
			document.querySelector("#output").innerHTML = "<p>Some JSON was downloaded - check the console!</p>";
			 const quakeInfo = json.features;
			let numQuakes;
			if (Array.isArray(quakeInfo)) {
		 		numQuakes = quakeInfo.length;
			}
			else {
			 	numQuakes = 1;
			}
			document.querySelector("#output").innerHTML = "Status: " + json.metadata.status + "<p>There have been " + numQuakes + " earthquakes so far this year</p>";
			console.log("json = ",json);
		}
		xhr.onerror = e => console.log(`In onerror - HTTP Status Code = ${e.target.status}`);
		xhr.open("GET",url);
		xhr.send();
	}
</script>
</body>
</html>
