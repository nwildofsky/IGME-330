<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeter</title>
    <style>
      *{font-size:1.5em;}
    </style>
  </head>
<body>
  <button>Click Me!</button>
  <input id="input-firstname" placeholder="Type in your first name">
  <input id="input-lastname" placeholder="Type in your last name">
  <p id="output">???</p>
  <script>
    'use strict';
    
    // 1 - get a reference to the button
    const button = document.querySelector("button");

    // 2 - add a click event to button that calls a `sayHello` function
    button.onclick = sayHello;

    // 3 - create a `sayHello()` function
    // 3A - get name of person from the <input>
    // 3B - get a reference to the #output <p>
    // 3C - update HTML of #output <p>
    function sayHello() {
        console.log("sayHello");
        let fname = document.querySelector("#input-firstname").value;
        !fname.trim() ? fname = "Andrew" : fname;
        let lname = document.querySelector("#input-lastname").value;
        !lname.trim() ? lname = "Pearsal" : lname;

        let output = document.querySelector("#output");
        output.innerHTML = "Hello " + fname + " " + lname + "!";
    }
  </script>
</body>
</html>
