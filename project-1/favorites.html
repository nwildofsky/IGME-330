<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quake Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.0/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/f7be11d31e.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./styles/default-styles.css" type="text/css">
  
  <script type="module" src="./src/init.js"></script>
  <script type="module" src="./src/favorites.js"></script>
</head>

<body class="is-blue">
  <app-navbar>Quake Tracker</app-navbar>

  <div class="container">
    <div id="favorites-container">
      <h1 class="title page-header">Saved Quakes</h1>
      <div class="box">
        <div id="options">
          <div class="form-row">
            <form>
              <label for="sort-order">Sort By</label>
              <div class="select is-small">
                <select id="sort-order">
                  <option selected>Newest First</option>
                  <option>Oldest First</option>
                  <option>Largest Magnitude First</option>
                  <option>Smallest Magnitude First</option>
                </select>
              </div>
            </form>
            <form>
              <label for="filter-by">Filter By Magnitude</label>
              <div class="select is-small">
                <select id="filter-by">
                  <option selected>No Filter</option>
                  <option>2+ mag</option>
                  <option>3+ mag</option>
                  <option>4+ mag</option>
                  <option>5+ mag</option>
                  <option>6+ mag</option>
                  <option>7+ mag</option>
                  <option>8+ mag</option>
                  <option>9+ mag</option>
                </select>
              </div>
            </form>

            <button class="button is-info" id="fav-clear">Clear All Saved</button>
            <button class="button is-link" id="ls-clear">Clear All App Preferences</button>
          </div>
        </div>
        <hr>
        <div id="favorite-list"></div>
      </div>
    </div>
  </div>

  <app-footer>
    <span slot="name">2022</span>
    <a href="https://earthquake.usgs.gov/fdsnws/event/1/" slot="api">USGS Earthquake Catalog</a>
    <a href="https://www.mapbox.com/" slot="map">Mapbox</a>
  </app-footer>
</body>

</html>
