<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quake Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.0/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Mapbox -->
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.3.1/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.3.1/mapbox-gl.css' rel='stylesheet' />
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/f7be11d31e.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="./styles/default-styles.css" type="text/css">
  <link rel="stylesheet" href="./styles/map-styles.css" type="text/css">
</head>

<body>
  <app-navbar></app-navbar>
  <div id="map"></div>

  <div id="search-list">
    <div class="box">
      <div id="search-options">
        <h2 class="title is-4">Search Earthquakes</h2>
        <div class="form-row">
          <form>
            <label for="start-time">Occurred After</label>
            <input class="input is-small" type="date" id="start-time">
          </form>
          <form>
            <label for="end-time">Occurred Before</label>
            <input class="input is-small" type="date" id="end-time">
          </form>
        </div>
        <div class="form-row">
          <form>
            <label for="min-mag">Min Mag.</label>
            <input class="input is-small" type="number" id="min-mag" min="0" max="10" step="0.5" value="0">
          </form>
          <form>
            <label for="max-mag">Max Mag.</label>
            <input class="input is-small" type="number" id="max-mag" min="0" max="10" step="0.5" value="10">
          </form>
          <form>
            <label for="min-depth">Min Depth</label>
            <input class="input is-small" type="number" id="min-depth" min="-100" max="1000" step="50" value="-100">
          </form>
          <form>
            <label for="max-dpeth">Max Depth</label>
            <input class="input is-small" type="number" id="max-depth" min="-100" max="1000" step="50" value="1000">
          </form>
        </div>
        <div class="form-row">
          <form>
            <label for="focus-location">Focus Location</label>
            <div class="select is-small">
              <select id="focus-location">
                <option selected>Choose a Location</option>
                <option>Japan</option>
                <option>India</option>
                <option>Indonesia</option>
                <option>Puerto Rico</option>
                <option>United States</option>
                <option>Alaska</option>
                <option>Central America</option>
                <option>Ecuador</option>
                <option>Turkey</option>
                <option>World</option>
              </select>
            </div>
          </form>
          <form>
            <label for="sort-order">Sort By</label>
            <div class="select is-small">
              <select id="sort-order">
                <option selected>Newest First</option>
                <option>Oldest First</option>
                <option>Largest Magnitude First</option>
                <option>Smallest Magnitude First</option>
              </select>
            </div>
          </form>
          <form>
            <label for="query-limit">Limit</label>
            <div class="select is-small">
              <select id="query-limit">
                <option>10</option>
                <option>20</option>
                <option>30</option>
                <option>40</option>
                <option selected>50</option>
                <option>60</option>
                <option>70</option>
                <option>80</option>
                <option>90</option>
                <option>100</option>
              </select>
            </div>
          </form>
        </div>
        <div class="form-row">
          <button class="button is-dark" id="search-btn">Search</button>
          <p class="has-text-grey ml-5" id="result-text">Showing 50 Quakes from search results</p>
        </div>
        <hr>
        <div class="collapse">
          <i class="fa-solid fa-angle-up fa-lg"></i>
        </div>
      </div>
      <div id="quake-list">
        <list-item></list-item>
      </div>
    </div>
  </div>

  <div id="selected-quake"></div>
